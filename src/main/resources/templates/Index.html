<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>School Management System</title>
        <!-- Thymeleaf Style Sheet link -->
        <link rel="stylesheet" th:href="@{/css/heading.css}">
        <!-- BootStrap Frame work CSS layout -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    </head>
    <body class="app-background">

        <!-- Top Navigation Header -->
        <div class="app-navbar">
            <h1 class="app-title">School Management System</h1>
        </div>

        <div class="container workspace-container">
            <div class="card workspace-card">

        <!-- Table Header Action bar combo -->
        <div class="container-fluid">

            <!-- Table Header Action bar combo -->
            <div class="workspace-header d-flex justify-content-between align-items-center">
                <h2>Student Registry</h2>
                <a class="btn btn-primary" th:href="@{/student/addstudent}">New Student</a>
            </div>

            <!-- Central Data Grid table container -->
            <div class="table-responsive-wrapper ">
            <table class="table table-hover custom-table">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Name</th>
                        <th scope="col">Email</th>
                        <th scope="col">Address</th>
                        <th scope="col"></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Iteration loop to display student details-->
                    <tr th:each="student : ${students}">
                        <td th:text="${student.id}"></td>
                        <td th:text="${student.name}"></td>
                        <td th:text="${student.email}"></td>
                        <td th:text="${student.address}"></td>
                        <td>
                            <a class="btn btn-sm btn-action-edit" th:href="@{/student/edit-action/{id}(id=${student.id})}">Edit</a>
                            <a class="btn btn-sm btn-action-delete" th:href="@{/student/delete-action/{id}(id=${student.id})}">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
