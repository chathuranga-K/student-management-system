<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Add New Student</title>
        <!-- main style sheet -->
        <link rel="stylesheet" th:href="@{/css/heading.css}">
        <!-- forms style sheet -->
        <link rel="stylesheet" th:href="@{/css/forms.html.css}">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    </head>
    <body class="app-background">

        <!-- Top Centered Brand Navigation Banner Header -->
        <header class="app-navbar">
            <h1 class="app-title">School Management System</h1>
        </header>

            <div class="container workspace-container">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">

                        <div class="card workspace-card">
                            <div class="workspace-header text-center">
                                <h2>Register New Student</h2>
                            </div>

                            <div class="table-responsive-wrapper">
                                <form action='#' method="POST" th:action="@{/student/add-action}" th:object="${student}" class="space-y-5" data-bs-validate>
                                    <!-- NAME LABEL-->
                                    <div class="form-field">
                                        <label for="name" class="form-label">Full Name</label>
                                        <input id="name" type="text" class="form-control" placeholder="e.g. John Doe" th:field="${student.name}" required>
                                        <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback d-block" th:errors="${student.name}"></div>
                                    </div>

                                    <!-- EMAIL LABEL-->
                                    <div class="form-field">
                                        <label for="email" class="form-label">Email Address</label>
                                        <input id="email" type="email" class="form-control" placeholder="example@gmail.com" th:field="${student.email}" required>
                                        <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback d-block" th:errors="${student.email}"></div>
                                    </div>

                                    <!-- ADDRESS LABEL-->
                                    <div class="form-field">
                                        <label for="address" class="form-label">Residential Address</label>
                                        <input id="address" type="text" class="form-control" placeholder="e.g. 123 Main St, Colombo" th:field="${student.address}" required>
                                        <div th:if="${#fields.hasErrors('address')}" class="invalid-feedback d-block" th:errors="${student.address}"></div>
                                    </div>
                                    <!-- SUBMIT BUTTON -->
                                    <div>
                                        <a th:href="@{/student/index}" class="btn btn-sm btn-action-delete">Cancel</a>
                                        <button type="submit" class="btn btn-sm btn-action-edit">Submit</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </body>
</html>
